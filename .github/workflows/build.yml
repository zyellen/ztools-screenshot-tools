name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify
        run: node scripts/verify.mjs

      - name: Package .zpx
        run: npm run package

      - name: Checksum
        run: |
          ls -l release/*.zpx
          sha256sum release/*.zpx | tee release/SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ztools-screenshot-tools-${{ github.ref_name }}
          path: |
            release/*.zpx
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zpx
            release/SHA256SUMS.txt
          generate_release_notes: true
